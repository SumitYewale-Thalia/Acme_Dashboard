<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview - Acme Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="overview">
  <nav>
    <h2>Acme Dashboard</h2>
    <a href="/" class="active">Overview</a>
    <a href="/orders.html" >Orders</a>
    <a href="/customers.html" >Customers</a>
  </nav>
  <main>
    <h1>Overview</h1>
    <section class="stats">
      <div class="card"><h3>Revenue</h3><div class="stat" id="revenue">-</div></div>
      <div class="card"><h3>Orders</h3><div class="stat" id="orders">-</div></div>
      <div class="card"><h3>Customers</h3><div class="stat" id="customers">-</div></div>
      <div class="card"><h3>Pending</h3><div class="stat" id="pending">-</div></div>
    </section>
    <section class="grid">
      <div class="card chart-wrap"><h3>Revenue by month</h3><div class="chart" id="chart"></div></div>
      <div class="card">
        <h3>Recent orders</h3>
        <table>
          <thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="recent"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
